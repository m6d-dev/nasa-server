[project]
name = "vigil-server"
version = "0.1.0"
description = "Vigil — astronaut health monitoring backend (NASA Space Apps 2026)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "litestar>=2.19,<3",
    "uvicorn[standard]>=0.42,<0.43",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.12,<3",
    "dependency-injector>=4.48,<5",
    "sqlalchemy==2.0.54",  # pinned as in the CRM: minor releases changed asyncpg typing before
    "asyncpg>=0.31,<0.32",
    "greenlet>=3.3,<4",
    "httpx>=0.28,<0.29",
    "numpy>=2.2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
ml = ["xgboost>=3,<4"]  # without it patterns come from the rule (BACKEND_TZ §8.3)

[dependency-groups]
test = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "websockets>=15"]
dev = ["ruff==0.15.22", "mypy>=1.19,<2"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["_crm_old"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP046"]  # Result keeps Generic[...] like the CRM original

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
